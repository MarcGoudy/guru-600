<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only
     Guru-600, the sound editor: the Prophet-600's panel for the P600 engine of the FM-1 (Felucca firmware). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>guru-600 editor</title>
<style>
@font-face { font-family: "MonRong"; src: url("fonts/MonRong.ttf") format("truetype"); font-display: block; }
@font-face { font-family: "Barlow C"; src: url("fonts/BarlowCondensed-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: block; }
@font-face { font-family: "Guru600"; src: url("fonts/Guru600.woff2") format("woff2"); font-display: block; }
@font-face { font-family: "Barlow C"; src: url("fonts/BarlowCondensed-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
:root {
  --bg: #000; --panel: #070707; --cream: #F2EDE0; --dim: #8d8a82; --rule-w: 2px;
  /* the families' colours as the FM-1's screen has them (firmware ui_draw.c P6_FAM_C); FX SENDS: the editor's */
  --pm: #A884FF; --lfo: #50C8E8; --osc: #F49638; --flt: #FF5046; --env: #FA7CC4; --ext: #FFE428;
  --mph: #40E0B4; --vce: #8CD86C; --fx: #4F86FF; --snd: #EDEBE6; --sel: #FFF22E; --kept: #FB8A1A; --red: #FF5046; --led: #2BE84F; --trk: #FF7A22;
}
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { font-variant-numeric: tabular-nums; color: var(--cream); font: 600 15px/1 "Barlow C", "Arial Narrow", sans-serif; text-transform: uppercase;
       -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.abs { position: absolute; box-sizing: border-box; }

/* header */
#logo { left: 22px; top: -12px; font: 400 112px/1 "MonRong"; color: #FBF6EA; text-transform: none; letter-spacing: 0; white-space: nowrap; }
#tribute { font: 700 17px/1 "Barlow C"; letter-spacing: 3px; margin-right: -3px; color: #F0362A; white-space: nowrap; }   /* (-3: the last letter's spacing) */
#status { top: 33px; height: 46px; display: flex; align-items: center; gap: 0; white-space: nowrap; }
#led { width: 16px; height: 16px; border-radius: 50%; margin-right: 11px; cursor: pointer; box-sizing: border-box; border: 1.5px solid color-mix(in srgb, var(--led) 70%, #fff);
       background: radial-gradient(circle at 38% 32%, rgba(255, 255, 255, .85) 0 2px, transparent 3.5px), radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--led) 40%, #fff), var(--led) 55%, color-mix(in srgb, var(--led) 70%, #000) 100%);
       box-shadow: 0 0 7px 2px color-mix(in srgb, var(--led) 90%, transparent), 0 0 18px 4px color-mix(in srgb, var(--led) 45%, transparent); }   /* (lit: connected) */
#conn { font: 700 25px/1 "Barlow C"; letter-spacing: .2px; }
.hsep { width: 2px; height: 34px; background: var(--cream); opacity: .8; margin: 0 26px; }
#bpmlbl { font: 700 25px/1 "Barlow C"; margin-right: 14px; }
/* PLAY STOP REC: unlit buttons; PLAY lit green while the FM-1 plays, REC red while the track is armed */
.tp { width: 46px; height: 46px; border-radius: 4px; box-sizing: border-box; margin-right: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;
      border: 1.5px solid color-mix(in srgb, var(--c) 30%, #333);
      background: linear-gradient(color-mix(in srgb, var(--c) 22%, #262626), color-mix(in srgb, var(--c) 16%, #0b0b0b));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -2px 3px rgba(0, 0, 0, .6), 0 2px 3px rgba(0, 0, 0, .7); }   /* (off: its colour, unlit) */
.tp svg { width: 22px; height: 22px; fill: color-mix(in srgb, var(--c) 45%, #2a2a2a); }
.tp#t-play { --c: #3BD16F; } .tp#t-rec { --c: var(--red); } .tp#t-stop, .tp#t-full, .tp#t-help { --c: var(--cream); } .tp#t-glow { --c: var(--cream); }
.tp#t-glow svg { fill: none; stroke: color-mix(in srgb, var(--c) 55%, #2a2a2a); }
/* lit: the button stays dark, only its bulb glows */
.tp#t-glow.on { border-color: color-mix(in srgb, var(--cream) 30%, #333) !important;
  background: linear-gradient(color-mix(in srgb, var(--cream) 10%, #262626), #0b0b0b) !important;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -2px 3px rgba(0, 0, 0, .6), 0 2px 3px rgba(0, 0, 0, .7) !important; }
.tp#t-glow.on svg { stroke: #fffdf4; fill: #fbf7ea;   /* (a white bulb: not EXTRAS' yellow) */
  filter: drop-shadow(0 0 3px rgba(255, 252, 240, .9)) drop-shadow(0 0 7px rgba(255, 252, 240, .5)); }
#t-glow { margin: 0; width: 40px; height: 40px; flex: none; }
/* FLAT (the bulb off): no light at all, the colours plain, as the mockup: no halo, no glow, no lighter centre */
body.flat *, body.flat *::before, body.flat *::after { box-shadow: none !important; filter: none !important; text-shadow: none !important; }
body.flat .knob .core { display: none; }
body.flat .sw.on, body.flat .hsw.on, body.flat .pill:not(.none), body.flat .tp.on { background: var(--c) !important; }
body.flat .trk.on { background: var(--trk) !important; }
body.flat .tab.on, body.flat .chip.on { background: var(--cream) !important; }
body.flat .row.on { background: var(--sel) !important; }
body.flat .radio .on i { background: var(--red) !important; }
body.flat #led:not(.off) { background: var(--led) !important; }
body.flat #slider .rail::before, body.flat #slider .rail::after { display: none; }
body.flat #bpm.b, body.flat #bpm.b1 { animation: none; }
body.flat #bpm.b { background: color-mix(in srgb, var(--cream) 25%, transparent); }
body.flat #bpm.b1 { background: color-mix(in srgb, var(--trk) 45%, transparent); }
.tp#t-full svg { fill: none; stroke: color-mix(in srgb, var(--c) 55%, #2a2a2a); }
.tp#t-help span { font: 700 26px/1 "Barlow C"; color: color-mix(in srgb, var(--c) 55%, #2a2a2a); }
#t-full, #t-help { margin: 0; width: 40px; height: 40px; flex: none; }
#t-full:active, #t-help:active { border-color: #fff; background: radial-gradient(ellipse at 50% 45%, #fff 0%, var(--cream) 62%, #bdb6a5 100%);
  box-shadow: 0 0 7px 2px color-mix(in srgb, var(--cream) 90%, transparent), 0 0 18px 3px color-mix(in srgb, var(--cream) 45%, transparent); }
#t-full:active svg { stroke: #0b0b0b; } #t-help:active span { color: #0b0b0b; }
.tp.on { border-color: color-mix(in srgb, var(--c) 70%, #fff); background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--c) 45%, #fff) 0%, var(--c) 62%, color-mix(in srgb, var(--c) 80%, #000) 100%);
         box-shadow: 0 0 7px 2px color-mix(in srgb, var(--c) 90%, transparent), 0 0 18px 3px color-mix(in srgb, var(--c) 45%, transparent); }
.tp.on svg { fill: #0b0b0b; }
.tp:active { transform: translateY(1px); }
.tp#t-stop:active { border-color: #fff; background: radial-gradient(ellipse at 50% 45%, #fff 0%, var(--cream) 62%, #bdb6a5 100%);   /* (STOP: lit while pressed) */
  box-shadow: 0 0 7px 2px color-mix(in srgb, var(--cream) 90%, transparent), 0 0 18px 3px color-mix(in srgb, var(--cream) 45%, transparent); }
.tp#t-stop:active svg { fill: #0b0b0b; }
/* the BPM's arrows, just above and below its box: one BPM a click (held: on and on); the box itself turns like a knob */
.bpmw { position: relative; }
.ba { position: absolute; left: 50%; width: 0; height: 0; margin-left: -7px; border-left: 7px solid transparent; border-right: 7px solid transparent; cursor: pointer; }
.ba::before { content: ""; position: absolute; left: -14px; right: -14px; top: -8px; bottom: -8px; }   /* (a larger place to click) */
.ba.up { top: -12px; border-bottom: 8px solid var(--cream); }
.ba.dn { bottom: -12px; border-top: 8px solid var(--cream); }
.ba:active { filter: drop-shadow(0 0 4px var(--cream)); }
/* the beat: the BPM box flashes on each beat and fades before the next, brighter on the bar's first (the track's orange) */
@keyframes beat { from { border-color: #fff; background: color-mix(in srgb, var(--cream) 22%, transparent); box-shadow: 0 0 9px 3px color-mix(in srgb, var(--cream) 85%, transparent), 0 0 22px 5px color-mix(in srgb, var(--cream) 40%, transparent),
                        inset 0 0 10px color-mix(in srgb, var(--cream) 45%, transparent); } }
@keyframes beat1 { from { border-color: color-mix(in srgb, var(--trk) 60%, #fff); color: #fff; background: color-mix(in srgb, var(--trk) 40%, transparent);
                         box-shadow: 0 0 12px 4px color-mix(in srgb, var(--trk) 95%, transparent), 0 0 30px 8px color-mix(in srgb, var(--trk) 55%, transparent),
                         inset 0 0 14px color-mix(in srgb, var(--trk) 65%, transparent); } }
#bpm.b { animation: beat var(--bt, .4s) ease-out; }
#bpm.b1 { animation: beat1 var(--bt, .4s) ease-out; }
#bpm { min-width: 66px; height: 46px; border: 2px solid var(--cream); border-radius: 4px; box-sizing: border-box; display: flex; align-items: center;
       justify-content: center; font: 700 27px/1 "Barlow C"; cursor: ns-resize; touch-action: none; padding: 0 8px; }
#trklbl { font: 700 25px/1 "Barlow C"; margin-right: 18px; }
.trk { width: 46px; height: 46px; border: 2px solid var(--cream); border-radius: 4px; display: flex; align-items: center; justify-content: center;
       font: 700 27px/1 "Barlow C"; margin-left: 10px; box-sizing: border-box; cursor: pointer; }
.trk.on { background: var(--trk); border-color: var(--trk); color: #140600; }

/* tabs */
#tabs { display: flex; gap: 8px; }
.tab { flex: 1; border: 2px solid var(--cream); border-radius: 4px; display: flex; align-items: center; justify-content: center;
       font: 600 22px/1 "Barlow C"; letter-spacing: .3px; cursor: pointer; }
.tab.on { background: var(--cream); color: #000; }
.tab.later { cursor: default; }

/* sections */
.sec { border: var(--rule-w) solid var(--c); border-radius: 7px; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
.sec .bd, .sec .grp, .sec .items { overflow: visible; }
.sec > .ttl { flex: none; height: 31px; padding-top: 3px; border-bottom: var(--rule-w) solid var(--c); color: var(--c); font: 400 21px/34px "Guru600";
              letter-spacing: .03em; -webkit-text-stroke: .6px currentColor; paint-order: stroke fill; padding-left: 10px; white-space: nowrap; }
.sec > .bd { flex: 1; display: flex; min-height: 0; }
.grp { display: flex; flex-direction: column; align-items: center; flex: 1 1 auto; min-width: 0; padding-top: var(--pt, 16px); }
.grp + .grp { border-left: var(--rule-w) solid var(--c); }
.grp.flat { border-left: 0 !important; }
.grp > .gt { font: 600 16px/1.1 "Barlow C"; text-align: center; height: var(--gth, 26px); display: flex; align-items: center; justify-content: center; white-space: pre; }
.grp > .gt:empty { height: 0; }
.grp > .items { display: flex; justify-content: space-evenly; align-items: flex-start; width: 100%; }
.item { display: flex; flex-direction: column; align-items: center; }
.item > .tl { font: 600 16px/1.1 "Barlow C"; height: var(--tlh, 26px); display: flex; align-items: center; text-align: center; white-space: pre; }
.item > .sl { font: 600 var(--slf, 17px)/1 "Barlow C"; margin-top: 6px; white-space: nowrap; }
.item > .v { font: 600 19px/1 "Barlow C"; margin-top: 4px; white-space: nowrap; text-transform: none; }
.knob { width: var(--kn, 66px); height: var(--kn, 66px); cursor: ns-resize; touch-action: none; display: block; }
.sw { width: 26px; height: 46px; border-radius: 5px; box-sizing: border-box; position: relative; cursor: pointer; margin-top: 8px; }

.radio { display: flex; flex-direction: column; gap: 9px; margin-top: 2px; }
.radio > div { display: flex; align-items: center; gap: 10px; font: 600 17px/1 "Barlow C"; cursor: pointer; }
.radio i { width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box; }
/* a one-shot button lights while it is pressed (MUTATE in its green, the cream ones cream, RESET red), as STOP */
.gbtn:active, .btn:active:not(.dis), .oct:active { color: #0b0b0b;
  background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--c, var(--cream)) 40%, #fff) 0%, var(--c, var(--cream)) 62%, color-mix(in srgb, var(--c, var(--cream)) 78%, #000) 100%);
  box-shadow: 0 0 7px 2px color-mix(in srgb, var(--c, var(--cream)) 90%, transparent), 0 0 18px 3px color-mix(in srgb, var(--c, var(--cream)) 45%, transparent); }
#sounds .btn:active:not(.dis), .oct:active { --c: var(--cream); }
#sounds .btn.red:active { --c: var(--red); }
.arr:active { filter: drop-shadow(0 0 4px var(--cream)) drop-shadow(0 0 9px color-mix(in srgb, var(--cream) 60%, transparent)); }
/* the same light on the cream buttons: what is lit glows, an outline glows faintly */
.tab, .btn, .chip, .oct, .trk, #bpm { box-shadow: 0 0 5px color-mix(in srgb, var(--cream) 35%, transparent), inset 0 0 4px color-mix(in srgb, var(--cream) 15%, transparent); }
.tab.on, .chip.on { background: radial-gradient(ellipse at 50% 45%, #fff 0%, var(--cream) 70%, #d9d2c1 100%);
  box-shadow: 0 0 7px 2px color-mix(in srgb, var(--cream) 85%, transparent), 0 0 18px 3px color-mix(in srgb, var(--cream) 40%, transparent); }
.trk.on { background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--trk) 45%, #fff) 0%, var(--trk) 65%, color-mix(in srgb, var(--trk) 80%, #000) 100%);
  box-shadow: 0 0 7px 2px color-mix(in srgb, var(--trk) 90%, transparent), 0 0 18px 3px color-mix(in srgb, var(--trk) 45%, transparent); }
.btn.red { box-shadow: 0 0 6px color-mix(in srgb, var(--red) 55%, transparent), inset 0 0 4px color-mix(in srgb, var(--red) 25%, transparent); }
/* a lit button as if a lamp were behind it: a bright centre, the colour, the edges a little darker */
.row.on { background: radial-gradient(ellipse 50% 80% at 50% 50%, #fffdf0 0%, color-mix(in srgb, var(--sel) 45%, #fff) 25%,
            var(--sel) 62%, color-mix(in srgb, var(--sel) 72%, #8a5a00) 100%);
  box-shadow: inset 0 0 5px rgba(0, 0, 0, .28), 0 0 7px 2px color-mix(in srgb, var(--sel) 85%, transparent), 0 0 18px 3px color-mix(in srgb, var(--sel) 40%, transparent); }
.row .n { box-shadow: 0 0 4px color-mix(in srgb, var(--cream) 30%, transparent); }
.row.kept .nm { text-shadow: 0 0 6px color-mix(in srgb, var(--kept) 70%, transparent); }
#list { padding: 6px 4px 0 4px; }
/* off: the same button and LED, unlit (a dark tint of its colour, its relief, a dull dot; a dark glass lens with a glint) */
.sw, .hsw, .pill.none {
  border: 1.5px solid color-mix(in srgb, var(--c) 30%, #333);
  background: linear-gradient(color-mix(in srgb, var(--c) 18%, #2a2a2a), color-mix(in srgb, var(--c) 14%, #0d0d0d));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -2px 3px rgba(0, 0, 0, .6), 0 2px 3px rgba(0, 0, 0, .7); }
.sw::after, .hsw::after { content: ""; position: absolute; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #5a5a5a, #2c2c2c 70%);
  box-shadow: inset 0 1px 1px rgba(0, 0, 0, .6); }
.sw::after { left: 50%; bottom: 7px; width: 12px; height: 12px; margin-left: -6px; }
.hsw::after { top: 50%; right: 6px; width: 11px; height: 11px; margin-top: -5.5px; }
.pill.none::after { display: block; background: radial-gradient(circle at 40% 35%, #5a5a5a, #2c2c2c 70%); }
.sw.on, .hsw.on { border-color: color-mix(in srgb, var(--c) 70%, #fff); }
.sw.on::after, .hsw.on::after { background: radial-gradient(circle at 40% 35%, #fff, #f1efe8 70%); box-shadow: 0 0 4px rgba(255, 255, 255, .8); }
.radio i { border: 1.5px solid #3a2523; background: radial-gradient(circle at 38% 32%, rgba(255, 255, 255, .35) 0 2px, transparent 3px),
  radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--red) 30%, #1a0b0a), #120707 75%);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 255, 255, .08); }
#led.off { background: radial-gradient(circle at 38% 32%, rgba(255, 255, 255, .3) 0 2px, transparent 3px), radial-gradient(circle at 50% 55%, #1d3a22, #0a140c 75%);
  border: 1.5px solid #203024; box-sizing: border-box; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .8); }
.radio .on i { background: radial-gradient(circle at 40% 35%, #ff8a80, var(--red) 55%, #c4221a); border-color: #ff6a60; box-shadow: 0 0 7px rgba(255, 80, 70, .7); }
.shape { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 4px; }
.shape .ic { display: flex; gap: 14px; }
.pill { width: 38px; height: 24px; border-radius: 5px; background: var(--c); position: relative; cursor: pointer; }
.pill::after { content: ""; position: absolute; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: #fff; left: 6px; transition: left .08s; }
.pill.r::after { left: 20px; }
.pill.none { box-sizing: border-box; }

/* low sections (VOICE, FX SENDS): one line */
.sec.low { flex-direction: row; align-items: center; }
.sec.low > .ttl { border-bottom: 0; border-right: var(--rule-w) solid var(--c); height: 100%; display: flex; align-items: center; padding: 3px 10px 0; line-height: 1.15; font-size: 21px; box-sizing: border-box; }
.sec.low > .bd { align-items: center; justify-content: space-evenly; height: 100%; }
.sec.low .item > .tl { height: auto; margin-bottom: 4px; font-size: 15px; }
.sec.low .kv { display: flex; align-items: center; gap: 4px; }
.sec.low .kv .v { margin-top: 0; font-size: 16px; width: 38px; text-transform: none; white-space: nowrap; }
.sec.low { --kn: 32px; }
#fxs > .ttl { padding: 3px 9px 0; font-size: 19px; }
#fxs > .bd { padding: 0 8px; }
.sec.low > .bd { padding: 0 10px; justify-content: space-between; }
#vce > .bd, #fxs > .bd { justify-content: space-evenly; }
#vce > .bd { justify-content: space-evenly; padding: 0 4px; }
#vce .item:first-child .kv .v { width: 50px; }   /* (LEVEL: "-4,0 dB" clear of PAN) */
#vce .item:nth-child(2) .kv .v { width: 22px; }

/* MIXER column */
.mix { display: flex; flex-direction: column; align-items: center; flex: 1; justify-content: space-evenly; }
.mix > .part { display: flex; flex-direction: column; align-items: center; width: 100%; padding-top: 12px; }
.mix > .part + .part { border-top: var(--rule-w) solid var(--c); padding-top: 22px; }
.mix > .part { padding-bottom: 14px; }
.mix .pt { color: var(--c); font: 400 18px/24px "Guru600"; letter-spacing: .02em; -webkit-text-stroke: .6px currentColor; paint-order: stroke fill; margin-bottom: 12px; }
:lang(zh) .sec > .ttl, :lang(ja) .sec > .ttl, :lang(zh) .mix .pt, :lang(ja) .mix .pt { font-weight: 700; }   /* (Guru600 has no CJK: the fallback in bold, as before) */
.mix .ab { display: flex; gap: 10px; font: 600 19px/1 "Barlow C"; margin-top: 6px; text-transform: none; }
.mix .ab b { font-weight: 600; text-transform: uppercase; }
.hsw { width: 42px; height: 27px; border-radius: 4px; box-sizing: border-box; position: relative; cursor: pointer; }

/* EXTRAS column */
.col { display: flex; flex-direction: column; flex: 1; justify-content: space-evenly; }
.col > .item { padding: 7px 0 7px; }
.col > .item + .item { border-top: var(--rule-w) solid var(--c); margin: 0 6px; }

/* SOUNDS */
#sounds { --c: var(--snd); }
#sounds > .ttl { color: #fff; border-bottom: 0; font-size: 21px; text-align: center; padding-left: 0; }
#chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 5px; padding: 0 8px 10px; }
.chip { height: 25px; border: 1.5px solid var(--cream); border-radius: 3px; display: flex; align-items: center; justify-content: center; font: 600 14px/1 "Barlow C"; cursor: pointer; }
.chip.on { color: #000; }
#list { position: relative; margin: 0 8px; flex: 1; min-height: 0; overflow-y: scroll; scrollbar-width: thin; scrollbar-color: #8a8a8a transparent; }
#list::-webkit-scrollbar { width: 6px; }
#list::-webkit-scrollbar-thumb { background: #8a8a8a; border-radius: 3px; }
.row { display: flex; align-items: center; height: 31px; margin: 0 8px 6px 0; cursor: pointer; border: 1.5px solid #2c2c2c; border-radius: 3px; background: #0c0c0c; }
.row .n { width: 30px; height: 31px; border-right: 1.5px solid #2c2c2c; display: flex; align-items: center; justify-content: center; font: 700 21px/1 "Barlow C"; flex: none; margin-left: -1.5px; border: 1.5px solid var(--cream); border-radius: 3px; box-sizing: border-box; }
.row .nm { padding-left: 14px; font: 600 18px/1 "Barlow C"; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.kept .nm { color: var(--kept); }
.row.on { border-color: var(--sel); color: #000; }   /* (its light: above, with the others) */
.row.on .nm { color: #000; }
.row.kept { --sel: var(--kept); }   /* (a place you saved, chosen: lit in its orange, not the yellow (Marc, 10/11)) */
.row.on .n { border-color: #000; }
.row.hide { display: none; }
#sbtn { display: flex; flex-direction: column; gap: 6px; padding: 8px 8px 12px; }
.btn { height: 30px; border: 2px solid var(--cream); border-radius: 4px; display: flex; align-items: center; justify-content: center; font: 600 17px/1 "Barlow C"; cursor: pointer; box-sizing: border-box; white-space: nowrap; }
.btn.red { border-color: var(--red); color: var(--red); margin-top: 6px; }
.btn.dis { opacity: .35; cursor: default; pointer-events: none; }

<script>
"use strict";
/* ------------------------------------------------------------------ the parameters (core.h P_*, params.c) --- */
const PE0 = 108;   // P_E0 (INFO says it; 103 since 1.5, 108 with INSERT 2: Guru-600 10/11)
const P = { LEVEL: 0, DIST: 33, CHOR: 34, DLY: 35, REV: 36, PAN: 39, SPRD: 95, ATK: 1, DEC: 2, SUS: 3, REL: 4, LRATE: 9, LWAVE: 10, LD_PIT: 13, LD_FLT: 14, LD_SHP: 15, VOICE: 37, GLIDE: 38, DETUNE: 44,
  VEL: 57, WHEEL: 60, FATK: 61, FDEC: 62, FSUS: 63, FREL: 64, APW: 66, BPW: 67, BFIN: 68, SYNC: 69, PMENV: 71, PMB: 72, PMDST: 73,
  KBD: 74, VINT: 76, AWAV: PE0, AFRQ: PE0 + 1, BWAV: PE0 + 2, BFRQ: PE0 + 3, CUT: PE0 + 4, RES: PE0 + 5, MIX: PE0 + 6, FENV: PE0 + 7 };
const F = { INT: 0, PCT: 1, BIPCT: 2, TIME: 3, LFOHZ: 4, CUTOFF: 5, DB: 6, ENUM: 8, ONOFF: 11, PAN: 100 };
const D = {};   // descriptors: {fmt, min, max, def, unit}
const dsc = (fmt, min, max, def, unit = "") => ({ fmt, min, max, def, unit });
Object.assign(D, {
  [P.ATK]: dsc(F.TIME, 0, 127, 10), [P.DEC]: dsc(F.TIME, 0, 127, 70), [P.SUS]: dsc(F.PCT, 0, 127, 90), [P.REL]: dsc(F.TIME, 0, 127, 60),
  [P.LRATE]: dsc(F.LFOHZ, 0, 127, 60), [P.LWAVE]: dsc(F.ENUM, 0, 4, 0), [P.LD_PIT]: dsc(F.BIPCT, -64, 63, 0), [P.LD_FLT]: dsc(F.BIPCT, -64, 63, 0),
  [P.LD_SHP]: dsc(F.BIPCT, -64, 63, 0), [P.VOICE]: dsc(F.ENUM, 0, 3, 0), [P.GLIDE]: dsc(F.TIME, 0, 127, 0), [P.DETUNE]: dsc(F.INT, 0, 127, 40),
  [P.VEL]: dsc(F.BIPCT, -64, 63, 0), [P.WHEEL]: dsc(F.PCT, 0, 63, 0),

  [P.APW]: dsc(F.PCT, 0, 127, 64), [P.BPW]: dsc(F.PCT, 0, 127, 64), [P.BFIN]: dsc(F.INT, 0, 127, 0), [P.SYNC]: dsc(F.ONOFF, 0, 1, 0),
  [P.PMENV]: dsc(F.PCT, 0, 127, 0), [P.PMB]: dsc(F.PCT, 0, 127, 0), [P.PMDST]: dsc(F.ENUM, 0, 3, 0), [P.KBD]: dsc(F.ENUM, 0, 2, 2),
  [P.VINT]: dsc(F.PCT, 0, 127, 24), [P.AWAV]: dsc(F.ENUM, 0, 7, 1), [P.AFRQ]: dsc(F.INT, 0, 63, 24, "st"), [P.BWAV]: dsc(F.ENUM, 0, 7, 1),

  [P.DIST]: dsc(F.PCT, 0, 127, 0), [P.CHOR]: dsc(F.PCT, 0, 127, 0), [P.DLY]: dsc(F.PCT, 0, 127, 0), [P.REV]: dsc(F.PCT, 0, 127, 0),
});
// the values shown (the device's, once connected); the drawing starts from the mockup's sound
const val = {};
for (const id in D) val[id] = D[id].def;
Object.assign(val, { [P.PMENV]: 53, [P.PMB]: 86, [P.PMDST]: 2, [P.LRATE]: 98, [P.LWAVE]: 3, [P.LD_PIT]: 63, [P.WHEEL]: 17, [P.AFRQ]: 24,
  [P.SYNC]: 0, [P.AWAV]: 1, [P.APW]: 61, [P.BFRQ]: 12, [P.BFIN]: 6, [P.BWAV]: 1, [P.BPW]: 77, [P.MIX]: 99, [P.GLIDE]: 46, [P.VOICE]: 0,
  [P.CUT]: 37, [P.RES]: 36, [P.FENV]: 93, [P.KBD]: 2, [P.FATK]: 46, [P.FDEC]: 75, [P.FSUS]: 119, [P.FREL]: 92, [P.ATK]: 0, [P.DEC]: 90,
  [P.SUS]: 114, [P.REL]: 85, [P.VINT]: 46, [P.VEL]: 33, [P.DETUNE]: 22, [P.SPRD]: 38, [P.CHOR]: 30, [P.DLY]: 22, [P.REV]: 45 });

const LANGS = ["en", "fr", "de", "es", "it", "zh", "ja"];   // (the messages: guru-app.js and each page in en, fr; guru-tx.js the others)
const lang = (() => {   // (SETTINGS > EDITOR > MESSAGES: kept in this browser; AUTO: the browser's language)
  let s = "auto"; try { s = localStorage.getItem("guru600-lang") || "auto"; } catch (e) {}
  const q = new URLSearchParams(location.search).get("lang"); if (LANGS.includes(q)) return q;   // (?lang=xx: that language, not kept; the guide's captures)
  const n = (navigator.language || "en").slice(0, 2);
  return LANGS.includes(s) ? s : LANGS.includes(n) ? n : "en";
})();
const dec = (s) => (["fr", "de", "es", "it"].includes(lang) ? s.replace(".", ",") : s);
function fmt(id, v) {
  const d = D[id];
  switch (d.fmt) {
    case F.PCT: return Math.trunc(((v - d.min) * 100 + (d.max - d.min) / 2) / (d.max - d.min)) + " %";
    case F.BIPCT: return Math.trunc(v * 100 / (v > 0 ? 63 : 64)) + " %";
    case F.TIME: {
      const ms10 = Math.round(10 * Math.pow(10000, (v & 127) / 127));
      if (ms10 < 100) return dec((ms10 / 10).toFixed(1)) + " ms";
      if (ms10 < 10000) return Math.round(ms10 / 10) + " ms";
      return dec((ms10 / 10000).toFixed(1)) + " s";
    }
    case F.LFOHZ: { const h = 0.05 * Math.pow(800, (v & 127) / 127); return dec(h < 10 ? h.toFixed(1) : h.toFixed(0)) + " Hz"; }
    case F.DB: return v <= 0 ? "OFF" : dec(((v - 112) / 2).toFixed(1)) + " dB";
    case F.PAN: { const n = Math.trunc(Math.abs(v) * 100 / (v > 0 ? 63 : 64)); return v ? (v < 0 ? "L " : "R ") + n : "C"; }
    case F.CUTOFF: { const h = 30 * Math.pow(16000 / 30, (v & 127) / 127); return h < 1000 ? Math.round(h) + " Hz" : dec((h / 1000).toFixed(1)) + " kHz"; }
    default: return d.names ? d.names[v - d.min] ?? String(v) : String(v) + (d.unit ? " " + d.unit : "");
  }
}

/* -------------------------------------------------------------------------------- the panel (layout) --- */

const K = (id, o = {}) => ({ k: "knob", id, ...o });          // a knob (tl: its label above, sl: below)
const S = (id, bit, o = {}) => ({ k: "sw", id, bit, ...o });   // a switch: bit of id (or id == 1 when bit is 0)
const SECTIONS = [
  { id: "pm", t: "POLY-MOD", c: "pm", box: [12, 155, 386, 358], groups: [
    { t: "SOURCE AMOUNT", items: [K(P.PMENV, { sl: "FIL ENV" }), K(P.PMB, { sl: "OSC B" })] },
    { t: "DESTINATION", items: [S(P.PMDST, 1, { sl: "FREQ A" }), S(P.PMDST, 2, { sl: "FILTER" })], gtDy: 15, dy: -2 }] },   // (Marc 11/11 : le titre et les interrupteurs à la hauteur de ceux d'OSCILLATOR A)
  { id: "lfo", t: "LFO", c: "lfo", box: [12, 366, 386, 569], groups: [
    { t: "FREQUENCY", items: [K(P.LRATE)] }, { t: "SHAPE", items: [{ k: "shape" }] },
    { t: "INITIAL<br>AMOUNT", items: [K(P.WHEEL, { inv: true })] },
    { t: "DESTINATION", items: [S(P.LD_PIT, 0, { sl: "FREQ A-B", lfo: 1 }), S(P.LD_SHP, 0, { sl: "PW A-B", lfo: 1 }), S(P.LD_FLT, 0, { sl: "FILTER", lfo: 1 })] }] },

const NS = "http://www.w3.org/2000/svg";

function knobSvg() {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", "0 0 74 74"); s.setAttribute("class", "knob"); s.setAttribute("overflow", "visible");
  const g = "kg" + gid++;

const R = 32.5;
const pt = (a) => [37 + R * Math.sin(a * Math.PI / 180), 37 - R * Math.cos(a * Math.PI / 180)];
function arcPath(a0, a1) {
  if (a1 - a0 < 0.5) return "";
  const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function drawKnob(svg, f, bip = false) {   // f 0..1; bip: the arc from the top (a bipolar amount)
  if (svg._f === f) return;   // (unchanged: nothing repainted)
  svg._f = f;
  const a = -135 + 270 * f, a0 = bip ? Math.min(0, a) : -135, a1 = bip ? Math.max(0, a) : a;
  svg.querySelector(".trk").setAttribute("d", arcPath(-135, 135));
  svg.querySelector(".arc").setAttribute("d", arcPath(a0, a1));
  svg.querySelector(".core").setAttribute("d", arcPath(a0 + 2, a1 - 2));

  l.setAttribute("x1", (37 + r0 * s).toFixed(2)); l.setAttribute("y1", (37 - r0 * c).toFixed(2));
  l.setAttribute("x2", (37 + r1 * s).toFixed(2)); l.setAttribute("y2", (37 - r1 * c).toFixed(2));
}

function setMorph(f) {
  const s = document.getElementById("slider");
  // the rail's green on the side of the sound that leads, all of it at the end the thumb is nearer, and it glows as much
  // (the nearer end at full from a third of the way out, half lit at the middle; the farther one as much less as it is farther)
  const near = Math.min(1, 0.5 + 1.5 * Math.abs(f - 0.5)), far = near * Math.min(f, 1 - f) / Math.max(f, 1 - f, 1e-6);
  const ga = Math.round((f <= 0.5 ? near : far) * 100), gb = Math.round((f >= 0.5 ? near : far) * 100);
  const rail = s.querySelector(".rail");
  rail.style.setProperty("--ga", ga + "%"); rail.style.setProperty("--gb", gb + "%");
  rail.style.setProperty("--ta", (100 - ga) + "%"); rail.style.setProperty("--tb", (100 - gb) + "%");
  s.querySelector(".fill").style.width = "0";
  s.querySelector(".thumb").style.left = f * 100 + "%";
  document.getElementById("mpos").textContent = Math.round(f * 100) + " %";   // (after the title, where it stays)
}

// 22 white keys: C to C, three octaves
function drawKeys() {
  const k = document.getElementById("keys"), w = k.clientWidth, hh = k.clientHeight;
  k.replaceChildren();
  const nw = 22, ww = w / nw, gap = 3;
  const BL = [1, 1, 0, 1, 1, 1, 0];   // a black key after these white keys (C D _ F G A _)
  const WN = [0, 2, 4, 5, 7, 9, 11];
  for (let i = 0; i < nw; i++) {
    const e = h("div", "wk"); e.style.left = (i * ww + gap / 2) + "px"; e.style.width = (ww - gap) + "px";
    e.dataset.n = 12 * Math.floor(i / 7) + WN[i % 7]; k.appendChild(e);
  }
  for (let i = 0; i < nw - 1; i++) {
    if (!BL[i % 7]) continue;
    const bw = ww * 0.58, e = h("div", "bk");
    e.style.left = ((i + 1) * ww - bw / 2) + "px"; e.style.width = bw + "px"; e.style.height = (hh * 0.63) + "px";
    e.dataset.n = 12 * Math.floor(i / 7) + WN[i % 7] + 1; k.appendChild(e);
  }
  if (typeof keysDrawn === "function") keysDrawn();
}

/* --------------------------------------------------------------------------------------------- drawing --- */
function render(only) {   // only: one parameter's controls (a change redraws only them: the halos are costly to paint)
  for (const c of ctl) {
    if (only != null && c.id !== +only) continue;
    const v = val[c.id], d = D[c.id];
    if (c.kind === "knob") {
      let f = (d.order ? d.order.indexOf(v - d.min) : v - d.min) / (d.max - d.min);   // (order: the device's shown order)
      if (c.inv) f = 1 - f;
      drawKnob(c.svg, Math.max(0, Math.min(1, f)), c.bip);
      c.v.textContent = c.inv ? Math.round(f * 100) + " %" : fmt(c.id, v);
    } else if (c.kind === "sw") {
      c.el.classList.toggle("on", c.lfo ? v !== 0 : c.bit ? !!(v & c.bit) : v === 1);
    } else if (c.kind === "radio") {
      c.el.classList.toggle("on", v === c.v);
    } else if (c.kind === "shape") {
      c.el.classList.toggle("r", v === 3); c.el.classList.toggle("none", v !== 1 && v !== 3);
    } else if (c.kind === "unison") {
      c.el.classList.toggle("on", v === 3);
    } else if (c.kind === "fld") {   // a value shown in a field (its arrows step it)
      c.el.textContent = d.names ? d.names[v - d.min] ?? String(v) : fmt(c.id, v);
    } else if (c.kind === "selb") {   // a button of a choice (ARP MODE, SCALE ...): lit when it is the value
      c.el.classList.toggle("on", v === c.v);
    }
  }
}

// the stage fills the window: scale from the height (the keyboard at its least) or the width, whichever is less; the
// width left over stretches the columns, the height left over the keyboard
function layout() {
  // the whole stage scaled to the window, centred; what the window has more is left black
  const vw = innerWidth, vh = innerHeight, s = Math.min(vw / DW, vh / DH), kx = 1;
  stage.style.width = DW + "px"; stage.style.height = DH + "px";
  stage.style.transform = `translate(${(vw - DW * s) / 2}px, ${(vh - DH * s) / 2}px) scale(${s})`;
  for (const e of stage.querySelectorAll("[data-box]")) {
    let [x0, y0, x1, y1] = e.dataset.box.split(",").map(Number);
    if (e.id === "logo") { e.style.left = x0 + "px"; e.style.top = y0 + "px"; continue; }
    if (e.id === "tribute") {   // its right edge on the logo's ink (the 0 of 600)
      const lg = document.getElementById("logo"), c = document.createElement("canvas").getContext("2d");
      c.font = getComputedStyle(lg).font; const m = c.measureText(lg.textContent);
      e.style.left = "auto"; e.style.width = "auto"; e.style.top = y0 + "px";
      e.style.right = (DW - (x0 + m.actualBoundingBoxRight)) + "px"; continue;
    }
    if (e.id === "status") { e.style.right = (DW - x1) * kx + "px"; e.style.top = y0 + "px"; continue; }
    e.style.left = x0 * kx + "px"; e.style.top = y0 + "px"; e.style.width = (x1 - x0) * kx + (kx - 1) * 0 + "px"; e.style.height = (y1 - y0) + "px";
  }
  for (const sec of stage.querySelectorAll(".sec")) {
    const bd = sec.querySelector(".bd"), gs = !bd ? [] : [...bd.children].filter((g) => g.classList.contains("grp"));
    if (!gs.length || sec.id === "morph" || (METRICS[sec.id] || {}).pt != null) continue;   // (pt: the mockup's place)
    sec.style.setProperty("--pt", "0px");
    const hmax = Math.max(...gs.map((g) => [...g.children].reduce((n, c) => n + c.offsetHeight, 0)));
    sec.style.setProperty("--pt", Math.max(4, (bd.clientHeight - hmax) / 2) + "px");
  }
  const kb = document.getElementById("kbd"), slot = Math.max(50, Math.min(130, kb.clientHeight - 112));
  for (const e of kb.querySelectorAll(".slot")) e.style.height = slot + "px";
  drawKeys();
}
